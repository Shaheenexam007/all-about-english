    <script type="module">


        // ====================================================
        // FIREBASE IMPORTS
        // ====================================================

        import {
            auth
        }
        from "../firebase-auth.js";


        import {
            app
        }
        from "../firebase-config.js";


        import {
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            updateDoc
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // ====================================================
        // FIRESTORE
        // ====================================================

        const db =
            getFirestore(app);


        // ====================================================
        // ELEMENTS
        // ====================================================

        const adminChecking =
            document.getElementById(
                "adminChecking"
            );


        const dashboard =
            document.getElementById(
                "dashboard"
            );


        const studentList =
            document.getElementById(
                "studentList"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const statusFilter =
            document.getElementById(
                "statusFilter"
            );


        const studentCount =
            document.getElementById(
                "studentCount"
            );


        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        // ====================================================
        // DATA
        // ====================================================

        let students =
            [];


        // ====================================================
        // ADMIN EMAIL
        // ====================================================
        //
        // IMPORTANT:
        // নিজের Firebase Admin account-এর email এখানে বসাবেন.
        //
        // উদাহরণ:
        //
        // const ADMIN_EMAIL = "youradmin@email.com";
        //
        // ====================================================

        const ADMIN_EMAIL =
            "Shaheenexam007";


        // ====================================================
        // TOAST
        // ====================================================

        function showToast(
            message
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.classList.add(
                "show"
            );


            setTimeout(
                function () {

                    toast.classList.remove(
                        "show"
                    );

                },
                2500
            );

        }


        // ====================================================
        // ESCAPE HTML
        // ====================================================

        function escapeHtml(
            value
        ) {

            return String(
                value || ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        // ====================================================
        // INITIAL
        // ====================================================

        onAuthStateChanged(
            auth,
            async function (user) {

                if (!user) {

                    window.location.href =
                        "../login.html";

                    return;

                }


                // ============================================
                // ADMIN CHECK
                // ============================================

                if (
                    user.email !==
                    ADMIN_EMAIL
                ) {

                    adminChecking.innerHTML = `

                        <i
                            class="fa-solid fa-lock"
                        ></i>

                        <p>
                            Admin access denied.
                        </p>

                    `;

                    return;

                }


                // ============================================
                // ADMIN VERIFIED
                // ============================================

                adminChecking.style.display =
                    "none";


                dashboard.style.display =
                    "block";


                await loadStudents();

            }
        );


        // ====================================================
        // LOAD STUDENTS
        // ====================================================

        async function loadStudents() {

            try {

                studentList.innerHTML = `

                    <div class="empty-state">

                        <i
                            class="fa-solid fa-spinner fa-spin"
                        ></i>

                        <h3>
                            Loading students...
                        </h3>

                        <p>
                            Please wait.
                        </p>

                    </div>

                `;


                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "students"
                        )
                    );


                students =
                    [];


                snapshot.forEach(
                    function (studentDoc) {

                        students.push({

                            id:
                                studentDoc.id,

                            ...studentDoc.data()

                        });

                    }
                );


                updateStats();

                renderStudents();

            }

            catch (error) {

                console.error(
                    "Load students error:",
                    error
                );


                studentList.innerHTML = `

                    <div class="error-box">

                        <strong>
                            Unable to load students.
                        </strong>

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        // ====================================================
        // UPDATE STATS
        // ====================================================

        function updateStats() {

            const total =
                students.length;


            const active =
                students.filter(
                    function (student) {

                        return (
                            student.accountStatus ===
                            "active"
                        );

                    }
                ).length;


            const unit11 =
                students.filter(
                    function (student) {

                        return (
                            student.approvedUnits &&
                            student.approvedUnits[
                                "unit-11"
                            ] === true
                        );

                    }
                ).length;


            const unit12 =
                students.filter(
                    function (student) {

                        return (
                            student.approvedUnits &&
                            student.approvedUnits[
                                "unit-12"
                            ] === true
                        );

                    }
                ).length;


            document.getElementById(
                "totalStudents"
            ).textContent =
                total;


            document.getElementById(
                "activeStudents"
            ).textContent =
                active;


            document.getElementById(
                "unit11Students"
            ).textContent =
                unit11;


            document.getElementById(
                "unit12Students"
            ).textContent =
                unit12;

        }


        // ====================================================
        // FILTER STUDENTS
        // ====================================================

        function getFilteredStudents() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const filter =
                statusFilter.value;


            return students.filter(
                function (student) {


                    // ========================================
                    // SEARCH
                    // ========================================

                    const name =
                        String(
                            student.name || ""
                        ).toLowerCase();


                    const mobile =
                        String(
                            student.mobile || ""
                        ).toLowerCase();


                    const email =
                        String(
                            student.email || ""
                        ).toLowerCase();


                    const matchesSearch =
                        !search ||
                        name.includes(search) ||
                        mobile.includes(search) ||
                        email.includes(search);


                    if (!matchesSearch) {

                        return false;

                    }


                    // ========================================
                    // STATUS
                    // ========================================

                    if (
                        filter ===
                        "active"
                    ) {

                        return (
                            student.accountStatus ===
                            "active"
                        );

                    }


                    if (
                        filter ===
                        "pending"
                    ) {

                        return (
                            student.accountStatus !==
                            "active"
                        );

                    }


                    return true;

                }
            );

        }


        // ====================================================
        // RENDER STUDENTS
        // ====================================================

        function renderStudents() {

            const filtered =
                getFilteredStudents();


            studentCount.textContent =
                filtered.length +
                (
                    filtered.length === 1
                    ? " student"
                    : " students"
                );


            if (
                filtered.length ===
                0
            ) {

                studentList.innerHTML = `

                    <div class="empty-state">

                        <i
                            class="fa-solid fa-user-slash"
                        ></i>

                        <h3>
                            No students found
                        </h3>

                        <p>
                            Try another search or filter.
                        </p>

                    </div>

                `;

                return;

            }


            studentList.innerHTML =
                filtered.map(
                    createStudentCard
                ).join("");

        }


        // ====================================================
        // CREATE STUDENT CARD
        // ====================================================

        function createStudentCard(
            student
        ) {

            const name =
                student.name ||
                "Unnamed Student";


            const mobile =
                student.mobile ||
                "Not provided";


            const email =
                student.email ||
                "Not provided";


            const college =
                student.college ||
                "Not provided";


            const accountStatus =
                student.accountStatus ||
                "pending";


            const isActive =
                accountStatus ===
                "active";


            const approvedUnits =
                student.approvedUnits ||
                {};


            const unit11Approved =
                approvedUnits[
                    "unit-11"
                ] === true;


            const unit12Approved =
                approvedUnits[
                    "unit-12"
                ] === true;


            const firstLetter =
                name
                    .charAt(0)
                    .toUpperCase();


            return `

                <div
                    class="student-card"
                    data-id="${escapeHtml(student.id)}"
                >


                    <!-- ====================================
                         STUDENT TOP
                    ===================================== -->

                    <div class="student-top">


                        <div class="student-identity">


                            <div class="student-avatar">

                                ${escapeHtml(
                                    firstLetter
                                )}

                            </div>


                            <div class="student-info">

                                <h3>

                                    ${escapeHtml(
                                        name
                                    )}

                                </h3>


                                <p>

                                    UID:
                                    ${escapeHtml(
                                        student.uid ||
                                        student.id
                                    )}

                                </p>

                            </div>


                        </div>


                        <div
                            class="
                                status-badge
                                ${
                                    isActive
                                    ? "status-active"
                                    : "status-pending"
                                }
                            "
                        >

                            <i
                                class="
                                    fa-solid
                                    ${
                                        isActive
                                        ? "fa-circle-check"
                                        : "fa-clock"
                                    }
                                "
                            ></i>

                            ${
                                isActive
                                ? "ACTIVE"
                                : "PENDING"
                            }

                        </div>


                    </div>


                    <!-- ====================================
                         DETAILS
                    ===================================== -->

                    <div class="student-details">


                        <div class="detail-box">

                            <small>
                                MOBILE
                            </small>

                            <strong>
                                ${escapeHtml(
                                    mobile
                                )}
                            </strong>

                        </div>


                        <div class="detail-box">

                            <small>
                                EMAIL
                            </small>

                            <strong>
                                ${escapeHtml(
                                    email
                                )}
                            </strong>

                        </div>


                        <div class="detail-box">

                            <small>
                                COLLEGE
                            </small>

                            <strong>
                                ${escapeHtml(
                                    college
                                )}
                            </strong>

                        </div>


                    </div>


                    <!-- ====================================
                         UNIT APPROVAL
                    ===================================== -->

                    <div class="approval-area">


                        <div class="approval-title">

                            UNIT APPROVAL

                        </div>


                        <div class="unit-buttons">


                            <button
                                type="button"
                                class="
                                    unit-btn
                                    ${
                                        unit11Approved
                                        ? "approved"
                                        : ""
                                    }
                                "
                                onclick="
                                    toggleUnit(
                                        '${escapeHtml(student.id)}',
                                        'unit-11'
                                    )
                                "
                            >

                                <i
                                    class="
                                        fa-solid
                                        ${
                                            unit11Approved
                                            ? "fa-circle-check"
                                            : "fa-lock"
                                        }
                                    "
                                ></i>

                                Unit 11

                                ${
                                    unit11Approved
                                    ? " ✓"
                                    : ""
                                }

                            </button>


                            <button
                                type="button"
                                class="
                                    unit-btn
                                    ${
                                        unit12Approved
                                        ? "approved"
                                        : ""
                                    }
                                "
                                onclick="
                                    toggleUnit(
                                        '${escapeHtml(student.id)}',
                                        'unit-12'
                                    )
                                "
                            >

                                <i
                                    class="
                                        fa-solid
                                        ${
                                            unit12Approved
                                            ? "fa-circle-check"
                                            : "fa-lock"
                                        }
                                    "
                                ></i>

                                Unit 12

                                ${
                                    unit12Approved
                                    ? " ✓"
                                    : ""
                                }

                            </button>


                        </div>


                        <!-- =================================
                             ACCOUNT STATUS
                        ================================== -->

                        <div class="account-actions">


                            ${
                                !isActive
                                ? `

                                    <button
                                        type="button"
                                        class="
                                            action-btn
                                            activate-btn
                                        "
                                        onclick="
                                            setAccountStatus(
                                                '${escapeHtml(student.id)}',
                                                'active'
                                            )
                                        "
                                    >

                                        <i
                                            class="
                                                fa-solid
                                                fa-user-check
                                            "
                                        ></i>

                                        Activate Account

                                    </button>

                                `
                                : ""
                            }


                            ${
                                isActive
                                ? `

                                    <button
                                        type="button"
                                        class="
                                            action-btn
                                            pending-btn
                                        "
                                        onclick="
                                            setAccountStatus(
                                                '${escapeHtml(student.id)}',
                                                'pending'
                                            )
                                        "
                                    >

                                        <i
                                            class="
                                                fa-solid
                                                fa-user-clock
                                            "
                                        ></i>

                                        Set Pending

                                    </button>

                                `
                                : ""
                            }


                        </div>


                    </div>


                </div>

            `;

        }


        // ====================================================
        // TOGGLE UNIT
        // ====================================================

        window.toggleUnit =
            async function (
                studentId,
                unitId
            ) {

                try {

                    const student =
                        students.find(
                            function (item) {

                                return (
                                    item.id ===
                                    studentId
                                );

                            }
                        );


                    if (!student) {

                        return;

                    }


                    const approvedUnits =
                        {
                            ...(
                                student.approvedUnits ||
                                {}
                            )
                        };


                    const current =
                        approvedUnits[
                            unitId
                        ] === true;


                    approvedUnits[
                        unitId
                    ] =
                        !current;


                    await updateDoc(
                        doc(
                            db,
                            "students",
                            studentId
                        ),
                        {
                            approvedUnits:
                                approvedUnits
                        }
                    );


                    student.approvedUnits =
                        approvedUnits;


                    updateStats();

                    renderStudents();


                    showToast(

                        !current
                        ? unitId +
                          " approved successfully."
                        : unitId +
                          " approval removed."

                    );

                }

                catch (error) {

                    console.error(
                        "Unit update error:",
                        error
                    );


                    alert(
                        "Unable to update unit approval.\n\n" +
                        error.message
                    );

                }

            };


        // ====================================================
        // ACCOUNT STATUS
        // ====================================================

        window.setAccountStatus =
            async function (
                studentId,
                status
            ) {

                try {

                    await updateDoc(
                        doc(
                            db,
                            "students",
                            studentId
                        ),
                        {
                            accountStatus:
                                status
                        }
                    );


                    const student =
                        students.find(
                            function (item) {

                                return (
                                    item.id ===
                                    studentId
                                );

                            }
                        );


                    if (student) {

                        student.accountStatus =
                            status;

                    }


                    updateStats();

                    renderStudents();


                    showToast(

                        status ===
                        "active"

                        ? "Student account activated."

                        : "Student account set to pending."

                    );

                }

                catch (error) {

                    console.error(
                        "Account status error:",
                        error
                    );


                    alert(
                        "Unable to update account status.\n\n" +
                        error.message
                    );

                }

            };


        // ====================================================
        // SEARCH
        // ====================================================

        searchInput.addEventListener(
            "input",
            renderStudents
        );


        // ====================================================
        // FILTER
        // ====================================================

        statusFilter.addEventListener(
            "change",
            renderStudents
        );


        // ====================================================
        // LOGOUT
        // ====================================================

        logoutBtn.addEventListener(
            "click",
            async function () {

                try {

                    await signOut(
                        auth
                    );


                    window.location.href =
                        "../login.html";

                }

                catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );


                    alert(
                        "Unable to logout."
                    );

                }

            }
        );


    </script>


</body>

</html>
