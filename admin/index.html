<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="All About English Admin Dashboard"
    >

    <title>
        Admin Dashboard | All About English
    </title>


    <style>

        :root {

            --navy:#101b36;
            --navy-dark:#091126;
            --gold:#c9a45c;
            --gold-light:#ead9ae;
            --ivory:#fbfaf6;
            --white:#ffffff;
            --text:#1d2940;
            --muted:#68748a;
            --border:#e5e1d8;

            --green:#237a52;
            --green-bg:#eaf6ef;

            --red:#a33b35;
            --red-bg:#faeeee;

            --yellow:#9a711b;
            --yellow-bg:#fff8df;

            --shadow:
                0 15px 45px rgba(16,27,54,.08);

        }


        * {

            margin:0;
            padding:0;
            box-sizing:border-box;

        }


        body {

            font-family:
                Arial,
                sans-serif;

            background:
                var(--ivory);

            color:
                var(--text);

            min-height:
                100vh;

        }


        button,
        input,
        select {

            font-family:inherit;

        }


        button {

            cursor:pointer;

        }


        header {

            background:
                var(--navy-dark);

            color:white;

            padding:
                16px 20px;

        }


        .header-inner {

            width:
                min(1250px,94%);

            margin:auto;

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:20px;

        }


        .brand {

            display:flex;

            align-items:center;

            gap:11px;

        }


        .brand-icon {

            width:42px;
            height:42px;

            border-radius:12px;

            background:
                rgba(255,255,255,.08);

            color:
                var(--gold-light);

            display:flex;

            align-items:center;

            justify-content:center;

            font-size:18px;

        }


        .brand strong {

            display:block;

            font-size:15px;

        }


        .brand span {

            display:block;

            color:
                var(--gold-light);

            font-size:9px;

            letter-spacing:1px;

            margin-top:3px;

        }


        .header-actions {

            display:flex;

            gap:8px;

        }


        .header-btn {

            border:
                1px solid rgba(255,255,255,.14);

            background:
                rgba(255,255,255,.07);

            color:white;

            padding:
                9px 12px;

            border-radius:9px;

            font-size:10px;

            font-weight:700;

            text-decoration:none;

        }


        .header-btn:hover {

            background:
                rgba(255,255,255,.15);

        }


        main {

            width:
                min(1250px,94%);

            margin:auto;

            padding:
                35px 0 60px;

        }


        .checking {

            background:white;

            border:
                1px solid var(--border);

            border-radius:18px;

            padding:50px 25px;

            text-align:center;

            box-shadow:
                var(--shadow);

        }


        .checking h2 {

            margin-top:15px;

            color:var(--navy);

            font-size:20px;

        }


        .checking p {

            color:var(--muted);

            font-size:11px;

            margin-top:7px;

        }


        .spinner {

            width:35px;
            height:35px;

            border:
                4px solid #eee;

            border-top-color:
                var(--gold);

            border-radius:50%;

            animation:
                spin 1s linear infinite;

            margin:auto;

        }


        @keyframes spin {

            to {
                transform:rotate(360deg);
            }

        }


        #dashboard {

            display:none;

        }


        .page-heading {

            margin-bottom:25px;

        }


        .page-heading h1 {

            font-size:28px;

            color:var(--navy);

            margin-bottom:6px;

        }


        .page-heading p {

            color:var(--muted);

            font-size:12px;

        }


        .admin-email {

            margin-top:8px;

            font-size:10px;

            color:var(--gold);

            font-weight:700;

        }


        .stats-grid {

            display:grid;

            grid-template-columns:
                repeat(4,1fr);

            gap:14px;

            margin-bottom:22px;

        }


        .stat-card {

            background:white;

            border:
                1px solid var(--border);

            border-radius:17px;

            padding:20px;

            box-shadow:
                var(--shadow);

        }


        .stat-card small {

            color:var(--muted);

            font-size:9px;

            font-weight:800;

            letter-spacing:.8px;

        }


        .stat-card strong {

            display:block;

            margin-top:12px;

            font-size:27px;

            color:var(--navy);

        }


        .control-panel {

            background:white;

            border:
                1px solid var(--border);

            border-radius:18px;

            padding:18px;

            box-shadow:
                var(--shadow);

        }


        .controls {

            display:grid;

            grid-template-columns:
                1fr 180px;

            gap:10px;

        }


        .search-box {

            position:relative;

        }


        .search-box input {

            width:100%;

            height:42px;

            border:
                1px solid var(--border);

            border-radius:10px;

            padding:
                0 13px;

            outline:none;

            background:#fcfbf8;

            font-size:11px;

        }


        .search-box input:focus {

            border-color:
                var(--gold);

        }


        select {

            height:42px;

            border:
                1px solid var(--border);

            border-radius:10px;

            padding:
                0 12px;

            outline:none;

            background:#fcfbf8;

            color:var(--text);

        }


        .list-heading {

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin:
                25px 0 12px;

        }


        .list-heading h2 {

            color:var(--navy);

            font-size:17px;

        }


        .student-count {

            color:var(--muted);

            font-size:10px;

        }


        .student-list {

            display:grid;

            gap:12px;

        }


        .student-card {

            background:white;

            border:
                1px solid var(--border);

            border-radius:17px;

            padding:18px;

            box-shadow:
                0 7px 25px rgba(16,27,54,.045);

        }


        .student-top {

            display:flex;

            justify-content:space-between;

            align-items:flex-start;

            gap:15px;

        }


        .student-identity {

            display:flex;

            gap:12px;

        }


        .student-avatar {

            width:43px;
            height:43px;

            min-width:43px;

            border-radius:12px;

            background:var(--navy);

            color:var(--gold-light);

            display:flex;

            align-items:center;

            justify-content:center;

            font-size:15px;

            font-weight:bold;

        }


        .student-info h3 {

            color:var(--navy);

            font-size:14px;

            margin-bottom:5px;

        }


        .student-info p {

            color:var(--muted);

            font-size:9px;

            line-height:1.6;

            word-break:break-all;

        }


        .status {

            padding:
                6px 10px;

            border-radius:999px;

            font-size:8px;

            font-weight:800;

        }


        .active {

            color:var(--green);

            background:var(--green-bg);

        }


        .pending {

            color:var(--yellow);

            background:var(--yellow-bg);

        }


        .details {

            display:grid;

            grid-template-columns:
                repeat(3,1fr);

            gap:8px;

            margin-top:15px;

        }


        .detail {

            background:#faf9f5;

            border:
                1px solid #eeeae0;

            border-radius:10px;

            padding:10px;

        }


        .detail small {

            display:block;

            color:#929aaa;

            font-size:8px;

            margin-bottom:4px;

        }


        .detail strong {

            display:block;

            color:var(--text);

            font-size:10px;

            word-break:break-word;

        }


        .approval {

            margin-top:15px;

            padding-top:15px;

            border-top:
                1px solid #eeeae0;

        }


        .approval-title {

            color:var(--navy);

            font-size:10px;

            font-weight:800;

            margin-bottom:9px;

        }


        .unit-buttons {

            display:flex;

            flex-wrap:wrap;

            gap:7px;

        }


        .unit-btn {

            border:
                1px solid var(--border);

            background:#faf9f5;

            color:var(--navy);

            padding:
                8px 11px;

            border-radius:9px;

            font-size:9px;

            font-weight:800;

        }


        .unit-btn.approved {

            background:var(--green-bg);

            border-color:#b9dfc8;

            color:var(--green);

        }


        .account-actions {

            margin-top:12px;

            display:flex;

            gap:7px;

            flex-wrap:wrap;

        }


        .action-btn {

            border:none;

            padding:
                8px 11px;

            border-radius:9px;

            font-size:9px;

            font-weight:800;

        }


        .activate {

            background:var(--green-bg);

            color:var(--green);

        }


        .deactivate {

            background:var(--yellow-bg);

            color:var(--yellow);

        }


        .empty {

            background:white;

            border:
                1px solid var(--border);

            border-radius:17px;

            padding:40px;

            text-align:center;

            color:var(--muted);

            font-size:11px;

        }


        .error {

            background:var(--red-bg);

            color:var(--red);

            border:
                1px solid #efd1ce;

            border-radius:12px;

            padding:15px;

            font-size:10px;

            line-height:1.6;

        }


        #toast {

            position:fixed;

            left:50%;

            bottom:25px;

            transform:
                translate(-50%,20px);

            background:var(--navy-dark);

            color:white;

            padding:
                11px 16px;

            border-radius:10px;

            font-size:10px;

            font-weight:700;

            opacity:0;

            pointer-events:none;

            transition:.25s;

            z-index:9999;

        }


        #toast.show {

            opacity:1;

            transform:
                translate(-50%,0);

        }


        @media(max-width:900px) {

            .stats-grid {

                grid-template-columns:
                    repeat(2,1fr);

            }

        }


        @media(max-width:650px) {

            .header-inner {

                width:100%;

            }

            .header-btn {

                padding:8px 9px;

                font-size:9px;

            }

            main {

                width:92%;

            }

            .controls {

                grid-template-columns:1fr;

            }

            .student-top {

                flex-direction:column;

            }

            .details {

                grid-template-columns:1fr;

            }

        }


    </style>

</head>


<body>


<header>

    <div class="header-inner">


        <div class="brand">

            <div class="brand-icon">
                🛡
            </div>

            <div>

                <strong>
                    ALL ABOUT ENGLISH
                </strong>

                <span>
                    ADMIN DASHBOARD
                </span>

            </div>

        </div>


        <div class="header-actions">

            <a
                href="../"
                class="header-btn"
            >
                Home
            </a>


            <button
                id="logoutBtn"
                class="header-btn"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main>


    <div
        id="adminChecking"
        class="checking"
    >

        <div class="spinner"></div>

        <h2>
            Checking Admin Access
        </h2>

        <p>
            Please wait while Firebase verifies your account.
        </p>

    </div>


    <div id="dashboard">


        <div class="page-heading">

            <h1>
                Student Management
            </h1>

            <p>
                Manage student accounts and approve learning units.
            </p>

            <div
                id="adminEmailDisplay"
                class="admin-email"
            ></div>

        </div>


        <div class="stats-grid">


            <div class="stat-card">

                <small>
                    TOTAL STUDENTS
                </small>

                <strong id="totalStudents">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <small>
                    ACTIVE STUDENTS
                </small>

                <strong id="activeStudents">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <small>
                    UNIT 11
                </small>

                <strong id="unit11Students">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <small>
                    UNIT 12
                </small>

                <strong id="unit12Students">
                    0
                </strong>

            </div>


        </div>


        <div class="control-panel">

            <div class="controls">

                <div class="search-box">

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search name, mobile or email..."
                        autocomplete="off"
                    >

                </div>


                <select id="statusFilter">

                    <option value="all">
                        All Students
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                </select>

            </div>

        </div>


        <div class="list-heading">

            <h2>
                Students
            </h2>

            <span
                id="studentCount"
                class="student-count"
            >
                0 students
            </span>

        </div>


        <div
            id="studentList"
            class="student-list"
        ></div>


    </div>

</main>


<div id="toast"></div>


<script type="module">


// ============================================================
// FIREBASE IMPORTS
// ============================================================

import {
    auth
} from "../firebase-auth.js";


import {
    app
} from "../firebase-config.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ============================================================
// FIRESTORE
// ============================================================

const db =
    getFirestore(app);


// ============================================================
// ADMIN EMAIL
// ============================================================
//
// IMPORTANT:
// Firebase Authentication-এ আপনার ADMIN account-এর
// exact email এখানে লিখবেন.
//
// Example:
//
// const ADMIN_EMAIL =
//     "shaheenexam007@gmail.com";
//
// ============================================================

const ADMIN_EMAIL =
    "shaheenexam007@gmail.com";


// ============================================================
// ELEMENTS
// ============================================================

const adminChecking =
    document.getElementById(
        "adminChecking"
    );


const dashboard =
    document.getElementById(
        "dashboard"
    );


const studentList =
    document.getElementById(
        "studentList"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const statusFilter =
    document.getElementById(
        "statusFilter"
    );


const studentCount =
    document.getElementById(
        "studentCount"
    );


const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );


const adminEmailDisplay =
    document.getElementById(
        "adminEmailDisplay"
    );


// ============================================================
// DATA
// ============================================================

let students = [];


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// ============================================================
// TOAST
// ============================================================

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 2500);

}


// ============================================================
// ADMIN AUTH CHECK
// ============================================================

onAuthStateChanged(
    auth,
    async (user) => {

        // ----------------------------------------------------
        // NOT LOGGED IN
        // ----------------------------------------------------

        if (!user) {

            window.location.href =
                "../login.html";

            return;

        }


        console.log(
            "Logged-in user:",
            user.email
        );


        // ----------------------------------------------------
        // ADMIN EMAIL CHECK
        // ----------------------------------------------------

        if (
            user.email !==
            ADMIN_EMAIL
        ) {

            adminChecking.innerHTML = `

                <div
                    style="
                        font-size:42px;
                        margin-bottom:15px;
                    "
                >
                    🔒
                </div>

                <h2>
                    Admin Access Denied
                </h2>

                <p>
                    This Firebase account is not registered as an administrator.
                </p>

                <p
                    style="
                        margin-top:10px;
                        color:#a33b35;
                    "
                >
                    Logged in as:
                    ${escapeHtml(user.email)}
                </p>

            `;

            return;

        }


        // ----------------------------------------------------
        // ADMIN VERIFIED
        // ----------------------------------------------------

        console.log(
            "ADMIN VERIFIED"
        );


        adminChecking.style.display =
            "none";


        dashboard.style.display =
            "block";


        adminEmailDisplay.textContent =
            "Admin: " + user.email;


        await loadStudents();

    }
);


// ============================================================
// LOAD STUDENTS
// ============================================================

async function loadStudents() {

    try {

        studentList.innerHTML = `

            <div class="empty">

                Loading students...

            </div>

        `;


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "students"
                )
            );


        students = [];


        snapshot.forEach(
            (studentDoc) => {

                students.push({

                    id:
                        studentDoc.id,

                    ...studentDoc.data()

                });

            }
        );


        console.log(
            "Students loaded:",
            students.length
        );


        updateStats();

        renderStudents();

    }

    catch (error) {

        console.error(
            "Load students error:",
            error
        );


        studentList.innerHTML = `

            <div class="error">

                <strong>
                    Unable to load students.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message
                )}

                <br><br>

                Check your Firestore Rules.

            </div>

        `;

    }

}


// ============================================================
// UPDATE STATS
// ============================================================

function updateStats() {

    const total =
        students.length;


    const active =
        students.filter(
            student =>
                student.accountStatus ===
                "active"
        ).length;


    const unit11 =
        students.filter(
            student =>
                student.approvedUnits &&
                student.approvedUnits["unit-11"] === true
        ).length;


    const unit12 =
        students.filter(
            student =>
                student.approvedUnits &&
                student.approvedUnits["unit-12"] === true
        ).length;


    document.getElementById(
        "totalStudents"
    ).textContent =
        total;


    document.getElementById(
        "activeStudents"
    ).textContent =
        active;


    document.getElementById(
        "unit11Students"
    ).textContent =
        unit11;


    document.getElementById(
        "unit12Students"
    ).textContent =
        unit12;

}


// ============================================================
// FILTER
// ============================================================

function getFilteredStudents() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filter =
        statusFilter.value;


    return students.filter(
        student => {

            const name =
                String(
                    student.name || ""
                ).toLowerCase();


            const mobile =
                String(
                    student.mobile || ""
                ).toLowerCase();


            const email =
                String(
                    student.email || ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                name.includes(search) ||
                mobile.includes(search) ||
                email.includes(search);


            if (!matchesSearch) {

                return false;

            }


            if (
                filter ===
                "active"
            ) {

                return (
                    student.accountStatus ===
                    "active"
                );

            }


            if (
                filter ===
                "pending"
            ) {

                return (
                    student.accountStatus !==
                    "active"
                );

            }


            return true;

        }
    );

}


// ============================================================
// RENDER
// ============================================================

function renderStudents() {

    const filtered =
        getFilteredStudents();


    studentCount.textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " student"
                : " students"
        );


    if (
        filtered.length === 0
    ) {

        studentList.innerHTML = `

            <div class="empty">

                No students found.

            </div>

        `;

        return;

    }


    studentList.innerHTML =
        filtered
            .map(createStudentCard)
            .join("");

}


// ============================================================
// CREATE STUDENT CARD
// ============================================================

function createStudentCard(
    student
) {

    const name =
        student.name ||
        "Unnamed Student";


    const mobile =
        student.mobile ||
        "Not provided";


    const email =
        student.email ||
        "Not provided";


    const college =
        student.college ||
        "Not provided";


    const status =
        student.accountStatus ||
        "pending";


    const isActive =
        status === "active";


    const approvedUnits =
        student.approvedUnits ||
        {};


    const unit11 =
        approvedUnits["unit-11"] === true;


    const unit12 =
        approvedUnits["unit-12"] === true;


    const firstLetter =
        name
            .charAt(0)
            .toUpperCase();


    return `

        <div
            class="student-card"
        >


            <div class="student-top">


                <div class="student-identity">


                    <div class="student-avatar">

                        ${escapeHtml(
                            firstLetter
                        )}

                    </div>


                    <div class="student-info">

                        <h3>

                            ${escapeHtml(
                                name
                            )}

                        </h3>


                        <p>

                            UID:
                            ${escapeHtml(
                                student.uid ||
                                student.id
                            )}

                        </p>

                    </div>

                </div>


                <div
                    class="
                        status
                        ${
                            isActive
                                ? "active"
                                : "pending"
                        }
                    "
                >

                    ${
                        isActive
                            ? "ACTIVE"
                            : "PENDING"
                    }

                </div>


            </div>


            <div class="details">


                <div class="detail">

                    <small>
                        MOBILE
                    </small>

                    <strong>
                        ${escapeHtml(
                            mobile
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        EMAIL
                    </small>

                    <strong>
                        ${escapeHtml(
                            email
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        COLLEGE
                    </small>

                    <strong>
                        ${escapeHtml(
                            college
                        )}
                    </strong>

                </div>


            </div>


            <div class="approval">


                <div class="approval-title">

                    UNIT APPROVAL

                </div>


                <div class="unit-buttons">


                    <button
                        class="
                            unit-btn
                            ${unit11 ? "approved" : ""}
                        "
                        onclick="
                            toggleUnit(
                                '${escapeHtml(student.id)}',
                                'unit-11'
                            )
                        "
                    >

                        ${unit11
                            ? "✓ Unit 11"
                            : "🔒 Unit 11"
                        }

                    </button>


                    <button
                        class="
                            unit-btn
                            ${unit12 ? "approved" : ""}
                        "
                        onclick="
                            toggleUnit(
                                '${escapeHtml(student.id)}',
                                'unit-12'
                            )
                        "
                    >

                        ${unit12
                            ? "✓ Unit 12"
                            : "🔒 Unit 12"
                        }

                    </button>


                </div>


                <div class="account-actions">


                    ${
                        !isActive
                            ? `

                                <button
                                    class="
                                        action-btn
                                        activate
                                    "
                                    onclick="
                                        setAccountStatus(
                                            '${escapeHtml(student.id)}',
                                            'active'
                                        )
                                    "
                                >

                                    ✓ Activate Account

                                </button>

                            `
                            : `

                                <button
                                    class="
                                        action-btn
                                        deactivate
                                    "
                                    onclick="
                                        setAccountStatus(
                                            '${escapeHtml(student.id)}',
                                            'pending'
                                        )
                                    "
                                >

                                    Set Pending

                                </button>

                            `
                    }


                </div>


            </div>


        </div>

    `;

}


// ============================================================
// TOGGLE UNIT
// ============================================================

window.toggleUnit =
async function (
    studentId,
    unitId
) {

    try {

        const student =
            students.find(
                item =>
                    item.id ===
                    studentId
            );


        if (!student) {

            return;

        }


        const approvedUnits = {

            ...(student.approvedUnits || {})

        };


        const current =
            approvedUnits[unitId] === true;


        approvedUnits[unitId] =
            !current;


        await updateDoc(

            doc(
                db,
                "students",
                studentId
            ),

            {
                approvedUnits:
                    approvedUnits
            }

        );


        student.approvedUnits =
            approvedUnits;


        updateStats();

        renderStudents();


        showToast(

            !current
                ? unitId +
                  " approved successfully."
                : unitId +
                  " approval removed."

        );

    }

    catch (error) {

        console.error(
            "Unit update error:",
            error
        );


        alert(
            "Unable to update unit approval.\n\n" +
            error.message
        );

    }

};


// ============================================================
// ACCOUNT STATUS
// ============================================================

window.setAccountStatus =
async function (
    studentId,
    status
) {

    try {

        await updateDoc(

            doc(
                db,
                "students",
                studentId
            ),

            {
                accountStatus:
                    status
            }

        );


        const student =
            students.find(
                item =>
                    item.id ===
                    studentId
            );


        if (student) {

            student.accountStatus =
                status;

        }


        updateStats();

        renderStudents();


        showToast(

            status === "active"

                ? "Student account activated."

                : "Student account set to pending."

        );

    }

    catch (error) {

        console.error(
            "Account status error:",
            error
        );


        alert(
            "Unable to update account status.\n\n" +
            error.message
        );

    }

};


// ============================================================
// SEARCH
// ============================================================

searchInput.addEventListener(
    "input",
    renderStudents
);


// ============================================================
// FILTER
// ============================================================

statusFilter.addEventListener(
    "change",
    renderStudents
);


// ============================================================
// LOGOUT
// ============================================================

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(auth);


            window.location.href =
                "../login.html";

        }

        catch (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "Unable to logout."
            );

        }

    }
);


</script>
