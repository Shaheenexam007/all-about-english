<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unit 11 | All About English</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Nirmala UI", Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

.header {
    background: linear-gradient(135deg, #123c69, #1d6fa5);
    color: white;
    text-align: center;
    padding: 30px 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

.header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 800;
}

.header h2 {
    margin: 8px 0 0;
    font-size: 22px;
    font-weight: 600;
}

.header p {
    margin: 8px 0 0;
    font-size: 15px;
}

.container {
    max-width: 900px;
    margin: 35px auto;
    padding: 0 18px;
}

.unit-title {
    text-align: center;
    margin-bottom: 30px;
}

.unit-title h2 {
    margin: 0;
    font-size: 28px;
    color: #123c69;
}

.unit-title p {
    margin-top: 8px;
    color: #666;
}

.lessons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.lesson-card {
    background: white;
    border-radius: 15px;
    padding: 25px 18px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,0.10);
    transition: 0.25s;
}

.lesson-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.16);
}

.lesson-number {
    font-size: 18px;
    font-weight: 700;
    color: #777;
    margin-bottom: 8px;
}

.lesson-card h3 {
    margin: 5px 0 20px;
    font-size: 22px;
    color: #123c69;
}

.lesson-button {
    display: inline-block;
    text-decoration: none;
    background: #123c69;
    color: white;
    padding: 11px 25px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    transition: 0.2s;
    cursor: pointer;
    border: none;
}

.lesson-button:hover {
    background: #0b2948;
}

.lesson-button.locked {
    background: #999;
    cursor: not-allowed;
}

.lesson-button.locked:hover {
    background: #888;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #666;
    font-size: 17px;
}

.message {
    display: none;
    text-align: center;
    margin: 20px auto;
    padding: 14px;
    border-radius: 8px;
    background: #fff3cd;
    color: #856404;
    max-width: 700px;
}

.footer {
    text-align: center;
    margin-top: 45px;
    padding: 20px;
    color: #666;
    font-size: 14px;
}

@media (max-width: 700px) {

    .header h1 {
        font-size: 25px;
    }

    .header h2 {
        font-size: 19px;
    }

    .lessons {
        grid-template-columns: 1fr;
    }

    .lesson-card {
        padding: 23px 15px;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>ALL ABOUT ENGLISH</h1>

    <h2>HSC English 1st Paper</h2>

    <p>Unit 11</p>

</header>


<main class="container">

    <div class="unit-title">

        <h2>UNIT 11</h2>

        <p>Select a lesson to continue</p>

    </div>


    <div id="loading" class="loading">

        Checking your access...

    </div>


    <div id="message" class="message"></div>


    <div id="lessons" class="lessons" style="display:none;">


        <!-- LESSON 1 -->

        <div class="lesson-card">

            <div class="lesson-number">
                LESSON 1
            </div>

            <h3>Lesson 1</h3>

            <a
                id="lesson1Button"
                class="lesson-button"
                href="https://shaheenexam007.github.io/all-about-english/hsc/1st-paper/unit-11/lesson-1/"
            >
                Checking...
            </a>

        </div>



        <!-- LESSON 2 -->

        <div class="lesson-card">

            <div class="lesson-number">
                LESSON 2
            </div>

            <h3>Lesson 2</h3>

            <a
                id="lesson2Button"
                class="lesson-button"
                href="https://shaheenexam007.github.io/all-about-english/hsc/1st-paper/unit-11/lesson-2/"
            >
                Checking...
            </a>

        </div>



        <!-- LESSON 3 -->

        <div class="lesson-card">

            <div class="lesson-number">
                LESSON 3
            </div>

            <h3>Lesson 3</h3>

            <a
                id="lesson3Button"
                class="lesson-button"
                href="https://shaheenexam007.github.io/all-about-english/hsc/1st-paper/unit-11/lesson-3/"
            >
                Checking...
            </a>

        </div>


    </div>

</main>


<footer class="footer">

    © All About English by Shaheen Sir

</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyB6xJFLJC9KReEJQAzHbOmB67DBg-zX4gE",

    authDomain:
        "all-about-english-007.firebaseapp.com",

    databaseURL:
        "https://all-about-english-007-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "all-about-english-007",

    storageBucket:
        "all-about-english-007.firebasestorage.app",

    messagingSenderId:
        "251678333411",

    appId:
        "1:251678333411:web:889369210cb79442f0a8d6",

    measurementId:
        "G-RVFY5YEX6L"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/*
   IMPORTANT:
   getAnalytics() এখানে ব্যবহার করছি না।
   তাই analytics import করার প্রয়োজন নেই।
*/


/* =====================================================
   LESSON DATA
===================================================== */

const lessons = [

    {
        id: "unit-11-lesson-1",
        buttonId: "lesson1Button"
    },

    {
        id: "unit-11-lesson-2",
        buttonId: "lesson2Button"
    },

    {
        id: "unit-11-lesson-3",
        buttonId: "lesson3Button"
    }

];


/* =====================================================
   GET BUTTON
===================================================== */

function getButton(id) {

    return document.getElementById(id);

}


/* =====================================================
   LOCK LESSON
===================================================== */

function lockLesson(button) {

    button.textContent = "🔒 Locked";

    button.classList.add("locked");

    button.removeAttribute("href");

    button.onclick = function(event) {

        event.preventDefault();

        alert(
            "This lesson has not been approved for your account yet."
        );

        return false;

    };

}


/* =====================================================
   OPEN LESSON
===================================================== */

function openLesson(button) {

    button.textContent = "🔓 Open Lesson";

    button.classList.remove("locked");

    button.onclick = null;

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.display = "block";

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(auth, async (user) => {


    const loading =
        document.getElementById("loading");

    const lessonContainer =
        document.getElementById("lessons");


    /* ================================================
       NOT LOGGED IN
    ================================================ */

    if (!user) {

        loading.style.display = "none";

        lessonContainer.style.display = "grid";


        lessons.forEach((lesson) => {

            lockLesson(
                getButton(lesson.buttonId)
            );

        });


        showMessage(
            "Please login to access your approved lessons."
        );

        return;

    }


    try {


        /* ============================================
           STUDENT DOCUMENT
        ============================================ */

        const studentRef =
            doc(db, "students", user.uid);


        const studentSnap =
            await getDoc(studentRef);


        /* ============================================
           STUDENT NOT FOUND
        ============================================ */

        if (!studentSnap.exists()) {

            loading.style.display = "none";

            lessonContainer.style.display = "grid";


            lessons.forEach((lesson) => {

                lockLesson(
                    getButton(lesson.buttonId)
                );

            });


            showMessage(
                "Student account information was not found."
            );

            return;

        }


        const studentData =
            studentSnap.data();


        /* ============================================
           ACCOUNT STATUS
        ============================================ */

        const accountStatus =
            studentData.accountStatus;


        if (accountStatus !== "active") {

            loading.style.display = "none";

            lessonContainer.style.display = "grid";


            lessons.forEach((lesson) => {

                lockLesson(
                    getButton(lesson.buttonId)
                );

            });


            showMessage(
                "Your account is not active yet. Please wait for administrator approval."
            );

            return;

        }


        /* ============================================
           APPROVED LESSONS
        ============================================ */

        const approvedLessons =
            studentData.approvedLessons || {};


        /* ============================================
           CHECK EACH LESSON
        ============================================ */

        lessons.forEach((lesson) => {


            const button =
                getButton(lesson.buttonId);


            const approved =
                approvedLessons[lesson.id] === true;


            if (approved) {

                openLesson(button);

            }

            else {

                lockLesson(button);

            }

        });


        /* ============================================
           SHOW LESSONS
        ============================================ */

        loading.style.display = "none";

        lessonContainer.style.display = "grid";


    }

    catch (error) {

        console.error(
            "Access verification error:",
            error
        );


        loading.style.display = "none";

        lessonContainer.style.display = "grid";


        lessons.forEach((lesson) => {

            lockLesson(
                getButton(lesson.buttonId)
            );

        });


        showMessage(
            "Unable to verify your lesson access."
        );

    }

});

</script>


</body>

</html>
