const passageText = `

I ‘want’ to write the most ‘beautiful’ words about Gaza but I can't. 
I can't not see the ‘poverty’, ‘siege’ and ‘famine’, ‘especially’ when all Gaza city ‘flooded’ into Al-Areesh and ‘emptied’ it from all ‘goods’ in two hours. 
I can't not see the ‘deprivation’ in every house, the ‘fear’ and the ‘sickness’.
What do you want me to say about Gaza? 
From when I became ‘aware’ of it, I was sad about everything inside it. 
Especially the ‘kids’ and even the ‘adults’, ‘youth’, women, girls, animals, ‘stones’ and trees, everything in it is ‘crying..’ I'm ‘looking for’ nice words to say and I can't find them.
The sea is the only thing that helps me ‘dream’. 
When I stand on the ‘shore’ I can ‘imagine’ Cyprus, travel to Paris, fly to Rome, ‘all while’ standing in the same spot. 
I go around the ‘whole’ world and in the ‘end’ I ‘land’ on my bed in our house, in the ‘middle’ of the ‘refugee’ ‘camp’. 
I go back to the ‘reality’ of Gaza, the ‘dirty’ ‘market’, ‘overflowing’ ‘sewage’, the ‘carts’, and what's on top of the carts, the ‘suffocating’ ‘smell’, and the ‘silent’ people who can't speak.
When I look at the clock and it's 11:55. 
I start ‘shaking’ and my heart ‘beats’ faster, I ‘feel’ that the ‘war’ ‘started’ again. 
Not only the clock ‘scares’ me -- everything that flies does, even the flies. 
I can't tell anyone about my fear so they don't call me a ‘wimp’ or a ‘sissy’. 
I'm most ‘scared’ for my older brothers. 
When a fly lands on any of them, I feel it's going to kill him. 
I start ‘shouting’ and I ‘run away’ from the place. 
That's why I'm now ‘escaping’ outside the house all the time, because of the many flies.

For the first time the streets of Gaza were ‘clean’, there wasn't a paper or a ‘cardboard’.
People were ‘collecting’ the paper from the streets to use it for ‘baking’, because the electricity was ‘disconnected’. 
My mum didn't want to bake and she asked me to ‘bring’ bread from the ‘oven’. 
The ‘queue’ at the oven ‘stretched’ from Gaza to the West Bank. 
People would line up for 8 hours to get to their turn and take half a pack of bread.
In seconds, a Palestinian rocket ‘launcher’ was ‘erected’ in the area and in less than one second the Israeli planes started ‘bombing’ it. 
People ‘began’ running in all ‘directions’ and the ambulances came.
People started falling ‘dead’... others were ‘injured’. 
I was in shock, and people in the street started telling me thank God you're safe. 
Anyway I went back home without the ‘loaf’ of bread. 
And my mum ‘yelled’ at me... but till today, she doesn't know why I didn't bring the bread.
When the war ‘started’, my mum, my brothers and sisters and I were in Russia, which made me always ‘worried’ about Dad. 
We wanted to ‘leave’ Russia and ‘return’ to Gaza among our family to live the ‘events’ with them. 
As soon as the war ‘ended’ and the ‘crossings’ ‘opened’, we returned to Gaza, and from then till today we've been hearing stories of the ‘war’.
I couldn't sleep in Russia because of my worry about Dad.

/* =========================================================
   GET ELEMENTS
========================================================= */

const passageContainer =
    document.getElementById("passage");


const vocabularyContainer =
    document.getElementById("vocabulary");



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}



/* =========================================================
   SPLIT FULL PASSAGE INTO SENTENCES
========================================================= */

function splitIntoSentences(text) {

    /*
       প্রথমে passage-এর line break ধরে
       speaker information আলাদা করা হবে।
    */

    const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);


    /*
       এগুলো sentence নয়।
       এগুলো শুধু speaker / location information।
    */

    const cleanLines = lines.filter(line => {

        // Example:
        // 26 Mahmud Najem, Born 1994
        // 31 Yasmeen Katbeh, Born 1996

        if (
            /^\d+\s+.+,\s*Born\s+\d{4}$/i.test(line)
        ) {
            return false;
        }


        // Example:
        // Ash Sheikh Radwan

        if (
            /^Ash Sheikh Radwan$/i.test(line)
        ) {
            return false;
        }


        return true;

    });


    /*
       এখন প্রতিটি paragraph-এর sentence
       আলাদা করা হবে।
    */

    const sentences = [];


    cleanLines.forEach(line => {

        const parts = line
            .split(
                /(?<=[.!?])\s+(?=[A-Z“"'])/
            )
            .map(sentence => sentence.trim())
            .filter(sentence => sentence.length > 0);


        parts.forEach(sentence => {

            sentences.push(sentence);

        });

    });


    return sentences;

}



/* =========================================================
   CREATE IDS
========================================================= */

function sentenceID(index) {

    return "passage-sentence-" + index;

}


function vocabularyID(index) {

    return "vocabulary-sentence-" + index;

}


function wordID(sentenceIndex, wordIndex) {

    return (
        "passage-word-" +
        sentenceIndex +
        "-" +
        wordIndex
    );

}



/* =========================================================
   MARK VOCABULARY WORDS
========================================================= */

function markVocabularyWords(
    sentence,
    vocabulary,
    sentenceIndex
) {

    let result = escapeHTML(sentence);

    vocabulary.forEach(
        (item, wordIndex) => {

            const word =
                escapeHTML(item.word);

            const safeWord =
                word.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );

            const regex =
                new RegExp(
                    "(?<![A-Za-z])" +
                    safeWord +
                    "(?![A-Za-z])",
                    "gi"
                );

            result =
                result.replace(
                    regex,

                    `<span
                        id="${wordID(sentenceIndex, wordIndex)}"
                        class="marked-word"
                        onclick="goToVocabularyWord(${sentenceIndex}, ${wordIndex})"
                    >$&</span>`
                );

        }
    );

    return result;
}



/* =========================================================
   CREATE PASSAGE
========================================================= */

function createPassage(sentences) {

    passageContainer.innerHTML = "";


    sentences.forEach(
        (sentence, sentenceIndex) => {

            const data =
                vocabularyData[sentenceIndex];


            const vocabulary =
                data ? data.vocabulary : [];


            const sentenceDiv =
                document.createElement("div");


            sentenceDiv.className =
                "passage-sentence";


            sentenceDiv.id =
                sentenceID(sentenceIndex);


            const sentenceHTML =
                markVocabularyWords(
                    sentence,
                    vocabulary,
                    sentenceIndex
                );


            sentenceDiv.innerHTML =

                sentenceHTML +

                `

                <a
                    href="#${vocabularyID(sentenceIndex)}"
                    class="action-button see-full"
                    onclick="highlightVocabularySentence(${sentenceIndex})"
                >
                    SEE FULL
                </a>


                <button
                    class="action-button pronounce"
                    onclick="pronounceSentence(${sentenceIndex})"
                >
                    🔊 PRONOUNCE
                </button>

                `;


            passageContainer.appendChild(
                sentenceDiv
            );

        }
    );

}



/* =========================================================
   CREATE VOCABULARY
========================================================= */

function createVocabulary(sentences) {

    vocabularyContainer.innerHTML = "";


    sentences.forEach(
        (sentence, sentenceIndex) => {

            const data =
                vocabularyData[sentenceIndex];


            if (!data) {

                return;

            }


            const box =
                document.createElement("div");


            box.className =
                "vocab-sentence";


            box.id =
                vocabularyID(sentenceIndex);


            let html =

                `

                <!-- ENGLISH SENTENCE -->

                <div class="vocab-english">

                    ${escapeHTML(sentence)}

                    <a
                        class="sentence-back-button"
                        onclick="goToPassageSentence(${sentenceIndex})"
                    >
                        ↩ BACK TO PASSAGE
                    </a>

                </div>


                <!-- BANGLA MEANING -->

                <div class="bangla-meaning">

                    ${escapeHTML(data.meaning)}

                    <a
                        class="sentence-back-button"
                        onclick="goToPassageSentence(${sentenceIndex})"
                    >
                        ↩ BACK TO PASSAGE
                    </a>

                </div>

                `;


            /* =================================================
               WORD CARDS
            ================================================= */


            data.vocabulary.forEach(
                (item, wordIndex) => {

                    html +=

                        `

                        <div
                            class="word-card"
                            id="vocab-word-${sentenceIndex}-${wordIndex}"
                        >

                            <div class="word-title">

                                ${escapeHTML(item.word)}

                            </div>


                            <div class="word-details">

                                <b>
                                    Part of Speech:
                                </b>

                                ${escapeHTML(item.pos)}

                                <br>


                                <b>
                                    Bangla Meaning:
                                </b>

                                ${escapeHTML(item.meaning)}

                                <br>


                                <b>
                                    IPA:
                                </b>

                                ${escapeHTML(item.ipa)}

                                <br>


                                <b>
                                    Pronunciation:
                                </b>

                                ${escapeHTML(item.pronunciation)}

                                <br>


                                <b>
                                    Synonyms:
                                </b>

                                ${escapeHTML(item.synonyms)}

                                <br>


                                <b>
                                    Antonyms:
                                </b>

                                ${escapeHTML(item.antonyms)}

                                <br>


                                <a
                                    class="back-to-passage"
                                    onclick="
                                        goToPassageWord(
                                            ${sentenceIndex},
                                            ${wordIndex}
                                        )
                                    "
                                >
                                    ↩ BACK TO PASSAGE
                                </a>

                            </div>

                        </div>

                        `;

                }
            );


            box.innerHTML = html;


            vocabularyContainer.appendChild(
                box
            );

        }
    );

}



/* =========================================================
   HIGHLIGHT VOCABULARY SENTENCE
========================================================= */

function highlightVocabularySentence(
    sentenceIndex
) {

    const target =
        document.getElementById(
            vocabularyID(sentenceIndex)
        );


    if (!target) {

        return;

    }


    setTimeout(() => {

        target.classList.add(
            "active-sentence"
        );


        setTimeout(() => {

            target.classList.remove(
                "active-sentence"
            );

        }, 2200);

    }, 250);

}

/* =========================================================
   GO TO VOCABULARY SENTENCE — INSTANT
========================================================= */

function goToVocabularySentence(sentenceIndex) {

    const target =
        document.getElementById(
            vocabularyID(sentenceIndex)
        );

    if (!target) {
        return;
    }

    /*
       Smooth scrolling সম্পূর্ণ বন্ধ।
       এক লাফে destination-এ যাবে।
    */

    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";

    target.scrollIntoView({
        behavior: "auto",
        block: "center"
    });

    target.classList.add("active-sentence");

    setTimeout(() => {

        target.classList.remove("active-sentence");

    }, 2200);
}


/* =========================================================
   GO TO VOCABULARY WORD — INSTANT
========================================================= */

function goToVocabularyWord(
    sentenceIndex,
    wordIndex
) {

    const target =
        document.getElementById(
            "vocab-word-" +
            sentenceIndex +
            "-" +
            wordIndex
        );

    if (!target) {
        return;
    }

    /*
       Smooth scrolling বন্ধ
    */

    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";


    /*
       ⭐ মূল correction ⭐

       আগে এখানে পুরো vocabulary sentence
       scroll করা হচ্ছিল।

       এখন সরাসরি clicked vocabulary
       WORD CARD-কে screen-এর মাঝখানে
       আনা হবে।
    */

    target.scrollIntoView({
        behavior: "auto",
        block: "center",
        inline: "nearest"
    });


    /*
       Exact vocabulary word highlight
    */

    const wordTitle =
        target.querySelector(".word-title");


    if (wordTitle) {

        wordTitle.classList.add(
            "active-word"
        );

    }


    /*
       2.5 seconds পরে highlight remove
    */

    setTimeout(() => {

        if (wordTitle) {

            wordTitle.classList.remove(
                "active-word"
            );

        }

    }, 2500);

}

    setTimeout(() => {

        target.classList.remove("active-sentence");

    }, 2200);
}


/* =========================================================
   GO TO EXACT PASSAGE WORD — INSTANT
========================================================= */

function goToPassageWord(
    sentenceIndex,
    wordIndex
) {

    const target =
        document.getElementById(
            wordID(
                sentenceIndex,
                wordIndex
            )
        );

    if (!target) {
        return;
    }


    /*
       Smooth scrolling বন্ধ
    */

    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";


    /*
       ⭐ সরাসরি নির্দিষ্ট marked word-কে
       screen-এর মাঝখানে আনা হবে
    */

    target.scrollIntoView({
        behavior: "auto",
        block: "center",
        inline: "nearest"
    });


    /*
       Exact passage word highlight
    */

    target.classList.add(
        "active-word"
    );


    /*
       2.5 seconds পরে highlight remove
    */

    setTimeout(() => {

        target.classList.remove(
            "active-word"
        );

    }, 2500);

}

/* =========================================================
   PRONUNCIATION
========================================================= */

function pronounceSentence(index) {

    const sentences =
        splitIntoSentences(
            passageText
        );


    const text =
        sentences[index];


    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Your browser does not support speech pronunciation."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang = "en-US";

    speech.rate = 0.85;

    speech.pitch = 1;


    window.speechSynthesis.speak(
        speech
    );

}



/* =========================================================
   CHECK DATA
========================================================= */

function checkData(sentences) {

    if (
        sentences.length !==
        vocabularyData.length
    ) {

        const warning =
            document.createElement("div");


        warning.className =
            "data-warning";


        warning.innerHTML =

            `

            <b>Content warning:</b>

            Passage-এ

            <b>${sentences.length}</b>

            টি sentence পাওয়া গেছে,

            কিন্তু Vocabulary data-তে

            <b>${vocabularyData.length}</b>

            টি entry আছে।

            <br><br>

            প্রতিটি Passage sentence-এর জন্য
            Vocabulary section-এ একটি করে
            data object থাকতে হবে।

            `;


        document.body.insertBefore(
            warning,
            document.getElementById(
                "passage"
            )
        );

    }

}



/* =========================================================
   START
========================================================= */

const sentences =
    splitIntoSentences(
        passageText
    );


checkData(sentences);


createPassage(
    sentences
);


createVocabulary(
    sentences
);


</script>
