        /* -------------------------------------------------------------
           1. AUDIO & SOUND EFFECTS
        ------------------------------------------------------------- */
        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(650, ctx.currentTime);
                gain.gain.setValueAtTime(0.03, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.07);
            } catch(e){}
        }

        function speakText(text) {
            playClickSound();
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        { text: "filling the sky above the budding forest trees with wistful melancholy", type: "Present Participial Phrase, not a Finite Subordinate Clause", exp: "এখানে filling একটি present participle; আলাদা subject ও finite verb নেই, তাই এটি finite subordinate clause নয়। এটি main clause-এর ফল/পরিণতি নির্দেশ করছে।" },
        { text: "the green shoots of early spring sighed in the southerly breeze, filling the sky above the budding forest trees with wistful melancholy", type: "Simple Sentence with Participial Phrase", exp: "একটি finite main clause-এর সঙ্গে participial phrase যুক্ত হয়েছে; তাই finite clause-এর বিচারে এটি simple sentence।" }
    ]
}

];

        /* Helper function to find word data dynamically across sentences */
        function getWordData(wordOrPhrase) {
            const cleanKey = wordOrPhrase.trim().toLowerCase();
            for (let sObj of passageSentencesData) {
                if (sObj.wordsData && sObj.wordsData[cleanKey]) {
                    return sObj.wordsData[cleanKey];
                }
            }
            return null;
        }

        /* -------------------------------------------------------------
           3. PASSAGE RENDERER (HANDLES SINGLE WORDS & MULTI-WORD PHRASES)
        ------------------------------------------------------------- */
        function renderPassage() {
            const container = document.getElementById('passageContainer');
            container.innerHTML = '';

            let colorIndexCounter = 0;

            passageSentencesData.forEach((sObj) => {
                const sentenceSpan = document.createElement('span');
                
                // Regular Expression to match quoted words/phrases (including smart quotes like ‘ ’ or " ")
                const tokens = sObj.fullText.split(/([‘’“”'"][\w\s-]+[‘’“”'"])/g);

                tokens.forEach(token => {
                    if (!token) return;

                    // Check if the token is wrapped inside any kind of quote marks
                    if (/^[‘’“”'"].*[‘’“”'"]$/.test(token)) {
                        const cleanPhrase = token.replace(/[‘’“”'"]/g, "").trim();
                        const wordSpan = document.createElement('span');
                        wordSpan.className = 'p-word-clickable q-word';
                        wordSpan.innerText = token; // Keeping original quote characters intact

                        const color = vibrantColors[colorIndexCounter % vibrantColors.length];
                        wordSpan.style.color = color;
                        colorIndexCounter++;

                        wordSpan.onclick = () => openWordModal(cleanPhrase.toLowerCase(), true);
                        sentenceSpan.appendChild(wordSpan);
                        sentenceSpan.appendChild(document.createTextNode(' '));
                    } else {
                        // Regular unquoted text split into individual clickable words
                        const regularWords = token.split(' ');
                        regularWords.forEach(w => {
                            if(!w) return;
                            const cleanWord = w.replace(/[^a-zA-Z]/g, "").toLowerCase();
                            const wordSpan = document.createElement('span');
                            wordSpan.className = 'p-word-clickable';
                            wordSpan.innerText = w + ' ';
                            wordSpan.onclick = () => openWordModal(cleanWord, false);
                            sentenceSpan.appendChild(wordSpan);
                        });
                    }
                });

                // Add Dive Into Button per sentence
                const diveBtn = document.createElement('button');
                diveBtn.className = 'btn-dive';
                diveBtn.innerText = 'dive into';
                diveBtn.onclick = () => openSentenceModal(sObj.id);

                sentenceSpan.appendChild(diveBtn);
                sentenceSpan.appendChild(document.createTextNode(' '));
                container.appendChild(sentenceSpan);
            });
        }

        /* -------------------------------------------------------------
           4. WORD PARTICULARS POPUP (DYNAMIC & COMPACT LOGIC)
        ------------------------------------------------------------- */
        function openWordModal(wordOrPhrase) {
            playClickSound();
            const modal = document.getElementById('wordModal');
            document.getElementById('popWordTitle').innerText = wordOrPhrase.toUpperCase();
            
            const container = document.getElementById('wordParticularsContainer');
            container.innerHTML = '';

            const matchedData = getWordData(wordOrPhrase);

            let data;
            if (matchedData) {
                data = {
                    ipa: matchedData.ipa || `/${wordOrPhrase}/`,
                    banglaPron: matchedData.banglaPron || wordOrPhrase,
                    meaning: matchedData.meaning || "প্যাসেজের প্রসঙ্গ অনুযায়ী প্রযোজ্য।",
                    pos: matchedData.pos || "General Word",
                    contextPos: matchedData.contextPos || "Contextual Word",
                    derivatives: matchedData.derivatives || "N/A",
                    synonyms: matchedData.synonyms || [],
                    antonyms: matchedData.antonyms || []
                };
            } else {
                data = {
                    ipa: `/${wordOrPhrase}/`,
                    banglaPron: wordOrPhrase,
                    meaning: "প্যাসেজের প্রসঙ্গ অনুযায়ী প্রযোজ্য।",
                    pos: "General Word",
                    contextPos: "Contextual Word",
                    derivatives: "N/A",
                    synonyms: [],
                    antonyms: []
                };
            }

            const cardsData = [
                { title: "IPA & Phonetics", content: data.ipa, border: "#3b82f6", bg: "#eff6ff" },
                { title: "Bangla Pronunciation", content: data.banglaPron, border: "#10b981", bg: "#ecfdf5" },
                { title: "Bangla Meaning", content: data.meaning, border: "#f59e0b", bg: "#fffbeb" },
                { title: "Parts of Speech", content: `${data.pos} (Contextual: ${data.contextPos})`, border: "#8b5cf6", bg: "#f5f3ff" },
                { title: "Derivatives", content: (data.derivatives && data.derivatives.trim() !== "") ? data.derivatives : "N/A", border: "#ec4899", bg: "#fdf2f8" },
                { title: "Synonyms", content: (Array.isArray(data.synonyms) && data.synonyms.length > 0) ? data.synonyms.join(", ") : "N/A", border: "#06b6d4", bg: "#ecfeff" },
                { title: "Antonyms", content: (Array.isArray(data.antonyms) && data.antonyms.length > 0) ? data.antonyms.join(", ") : "N/A", border: "#ef4444", bg: "#fef2f2" }
            ];

            cardsData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'part-card';
                card.style.borderColor = item.border;
                card.style.backgroundColor = item.bg;
                card.innerHTML = `
                    <div class="part-card-title" style="color:${item.border}">${item.title}</div>
                    <div class="part-card-content">${item.content}</div>
                `;
                container.appendChild(card);
            });

            modal.style.display = 'flex';
        }

        function closeWordModal() {
            playClickSound();
            document.getElementById('wordModal').style.display = 'none';
        }

        /* -------------------------------------------------------------
           5. DIVE INTO SENTENCE POPUP & DYNAMIC LOGIC
        ------------------------------------------------------------- */
        let currentActiveSentenceObj = null;

        function openSentenceModal(sentenceId) {
            playClickSound();
            currentActiveSentenceObj = passageSentencesData.find(s => s.id === sentenceId);
            const modal = document.getElementById('sentenceModal');

            renderStickySentence();

            const meaningBox = document.getElementById('stickySentenceMeaning');
            const activeBar = document.getElementById('activeSelectionBar');
            
            meaningBox.style.display = 'block';
            meaningBox.innerText = "বাংলা অর্থ: " + currentActiveSentenceObj.banglaMeaning;
            activeBar.style.display = 'none';

            switchSentenceTab('phrases');
            modal.style.display = 'flex';
        }

        function closeSentenceModal() {
            playClickSound();
            document.getElementById('sentenceModal').style.display = 'none';
        }

        function renderStickySentence() {
            const container = document.getElementById('stickySentenceView');
            container.innerHTML = '';

            const words = currentActiveSentenceObj.cleanText.split(' ');
            words.forEach((w, idx) => {
                const span = document.createElement('span');
                span.className = 'p-word-clickable';
                span.dataset.index = idx;
                span.dataset.word = w.replace(/[^a-zA-Z]/g, "").toLowerCase();
                span.innerText = w + ' ';
                container.appendChild(span);
            });
        }

        function switchSentenceTab(tab) {
            playClickSound();
            document.getElementById('btnTabPhrase').className = tab === 'phrases' ? 'tab-btn active-tab' : 'tab-btn';
            document.getElementById('btnTabClause').className = tab === 'clauses' ? 'tab-btn active-tab' : 'tab-btn';

            const container = document.getElementById('sentenceTabContainer');
            container.innerHTML = '';

            const list = tab === 'phrases' ? currentActiveSentenceObj.phrases : currentActiveSentenceObj.clauses;

            list.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'info-card';
                card.style.backgroundColor = itemCardColors[idx % itemCardColors.length];
                
                card.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        highlightExactTargetText(item.text, item.type);
                    }
                };

                card.innerHTML = `
                    <div style="font-weight:800; color:#0f172a; font-size:0.92rem;">"${item.text}"</div>
                    <button class="btn-explain" onclick="toggleExp('exp-sc-${idx}')">See ${tab === 'phrases' ? 'Phrase' : 'Clause'} Type & Explanation</button>
                    <div class="explanation-text" id="exp-sc-${idx}">
                        <strong>Type:</strong> ${item.type}<br>
                        <strong>Explanation:</strong> ${item.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function highlightExactTargetText(targetText, itemType) {
            playClickSound();
            
            const meaningBox = document.getElementById('stickySentenceMeaning');
            const activeBar = document.getElementById('activeSelectionBar');
            
            meaningBox.style.display = 'none';
            activeBar.style.display = 'block';
            activeBar.innerHTML = `📌 Selected Target: <span style="color:#000; font-weight:800;">"${targetText}"</span> (${itemType})`;

            const container = document.getElementById('stickySentenceView');
            const wordSpans = container.querySelectorAll('span');

            wordSpans.forEach(s => s.classList.remove('highlight-exact'));

            const sentenceText = currentActiveSentenceObj.cleanText;
            const targetClean = targetText.trim();
            const startIndex = sentenceText.indexOf(targetClean);

            if (startIndex !== -1) {
                const endIndex = startIndex + targetClean.length;

                let currentCharCount = 0;
                wordSpans.forEach(span => {
                    const spanText = span.innerText;
                    const spanStart = currentCharCount;
                    const spanEnd = spanStart + spanText.length;

                    if (spanStart < endIndex && spanEnd > startIndex) {
                        span.classList.add('highlight-exact');
                    }
                    currentCharCount = spanEnd;
                });
            }
        }

        function toggleExp(id) {
            playClickSound();
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        /* Security Key Blockers */
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'p' || e.key === 'a')) e.preventDefault();
            if (e.keyCode === 123) e.preventDefault();
        });

        window.onload = function() {
            renderPassage();
        };
    </script>
