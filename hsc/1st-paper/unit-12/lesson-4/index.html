/* =========================================================
   GET ELEMENTS
========================================================= */

const passageContainer =
    document.getElementById("passage");


const vocabularyContainer =
    document.getElementById("vocabulary");



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}



/* =========================================================
   SPLIT FULL PASSAGE INTO SENTENCES
========================================================= */

function splitIntoSentences(text) {

    const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);

    const cleanLines = lines.filter(line => {

        if (/^\d+\s+.+,\s*Born\s+\d{4}$/i.test(line)) {
            return false;
        }

        if (/^Ash Sheikh Radwan$/i.test(line)) {
            return false;
        }

        return true;
    });

    const sentences = [];

    cleanLines.forEach(line => {

        const parts = line
            .split(/(?<=[.!?])\s+(?=[A-Z“"‘'])/)
            .map(sentence => sentence.trim())
            .filter(sentence => sentence.length > 0);

        parts.forEach(sentence => {
            sentences.push(sentence);
        });

    });

    return sentences;
}


/* =========================================================
   SENTENCE TEXT MATCHING
   ---------------------------------------------------------
   Passage-এর sentence number এবং
   vocabulary entry number একই হওয়া আর
   বাধ্যতামূলক নয়।
========================================================= */

function normalizeSentenceForMatching(text) {

    return String(text || "")
        .toLowerCase()
        .replace(/^\s*\d+\)\s*/g, "")
        .replace(/[^a-z0-9\u0980-\u09ff]+/g, "")
        .trim();

}


function buildVocabularyMatches(sentences) {

    const usedPassageIndexes = new Set();

    return vocabularyData.map(
        (data, vocabularyIndex) => {

            const target =
                normalizeSentenceForMatching(
                    data.sentence
                );

            let passageIndex = -1;

            for (
                let i = 0;
                i < sentences.length;
                i++
            ) {

                if (usedPassageIndexes.has(i)) {
                    continue;
                }

                if (
                    normalizeSentenceForMatching(
                        sentences[i]
                    ) === target
                ) {

                    passageIndex = i;
                    usedPassageIndexes.add(i);
                    break;

                }

            }

            return {
                data,
                vocabularyIndex,
                passageIndex
            };

        }
    );

}


function buildPassageVocabularyMap(
    vocabularyMatches
) {

    const map = new Map();

    vocabularyMatches.forEach(match => {

        if (match.passageIndex >= 0) {
            map.set(
                match.passageIndex,
                match
            );
        }

    });

    return map;
}


/* =========================================================
   CREATE IDS
========================================================= */

function sentenceID(index) {
    return "passage-sentence-" + index;
}


function vocabularyID(index) {
    return "vocabulary-sentence-" + index;
}


function wordID(sentenceIndex, wordIndex) {

    return (
        "passage-word-" +
        sentenceIndex +
        "-" +
        wordIndex
    );

}


/* =========================================================
   MARK VOCABULARY WORDS
========================================================= */

function markVocabularyWords(
    sentence,
    vocabulary,
    passageIndex
) {

    let result = escapeHTML(sentence);

    vocabulary.forEach(
        (item, wordIndex) => {

            const word =
                escapeHTML(item.word);

            const safeWord =
                word.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );

            const regex =
                new RegExp(
                    "(?<![A-Za-z])" +
                    safeWord +
                    "(?![A-Za-z])",
                    "gi"
                );

            result =
                result.replace(
                    regex,

                    `<span
                        id="${wordID(passageIndex, wordIndex)}"
                        class="marked-word"
                        onclick="goToVocabularyWord(${passageIndex}, ${wordIndex})"
                    >$&</span>`
                );

        }
    );

    return result;
}


/* =========================================================
   CREATE PASSAGE
========================================================= */

function createPassage(
    sentences,
    passageVocabularyMap
) {

    passageContainer.innerHTML = "";

    sentences.forEach(
        (sentence, passageIndex) => {

            const match =
                passageVocabularyMap.get(
                    passageIndex
                );

            const data =
                match
                    ? match.data
                    : null;

            const vocabulary =
                data
                    ? data.vocabulary
                    : [];


            const sentenceDiv =
                document.createElement("div");

            sentenceDiv.className =
                "passage-sentence";

            sentenceDiv.id =
                sentenceID(passageIndex);


            const sentenceHTML =
                markVocabularyWords(
                    sentence,
                    vocabulary,
                    passageIndex
                );


            let actions = "";


            if (data) {

                actions +=
                    `
                    <a
                        href="#${vocabularyID(passageIndex)}"
                        class="action-button see-full"
                        onclick="highlightVocabularySentence(${passageIndex})"
                    >
                        SEE FULL
                    </a>
                    `;

            }


            actions +=
                `
                <button
                    class="action-button pronounce"
                    onclick="pronounceSentence(${passageIndex})"
                >
                    🔊 PRONOUNCE
                </button>
                `;


            sentenceDiv.innerHTML =
                sentenceHTML +
                actions;

            passageContainer.appendChild(
                sentenceDiv
            );

        }
    );

}


/* =========================================================

   ---------------------------------------------------------
   Vocabulary entry নিজেই তার English sentence
   দিয়ে Passage-এর matching sentence খুঁজে নেয়।
========================================================= */

) {

/* =========================================================
   HIGHLIGHT VOCABULARY SENTENCE
========================================================= */

function highlightVocabularySentence(
    sentenceIndex
) {

    const target =
        document.getElementById(
            vocabularyID(sentenceIndex)
        );


    if (!target) {

        return;

    }


    setTimeout(() => {

        target.classList.add(
            "active-sentence"
        );


        setTimeout(() => {

            target.classList.remove(
                "active-sentence"
            );

        }, 2200);

    }, 250);

}

/* =========================================================
   GO TO VOCABULARY SENTENCE — INSTANT
========================================================= */

function goToVocabularySentence(sentenceIndex) {

    const target =
        document.getElementById(
            vocabularyID(sentenceIndex)
        );

    if (!target) {
        return;
    }

    /*
       Smooth scrolling সম্পূর্ণ বন্ধ।
       এক লাফে destination-এ যাবে।
    */

    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";

    target.scrollIntoView({
        behavior: "auto",
        block: "center"
    });

    target.classList.add("active-sentence");

    setTimeout(() => {

        target.classList.remove("active-sentence");

    }, 2200);
}


/* =========================================================
   GO TO VOCABULARY WORD — INSTANT
========================================================= */

function goToVocabularyWord(
    sentenceIndex,
    wordIndex
) {

    const target =
        document.getElementById(
            "vocab-word-" +
            sentenceIndex +
            "-" +
            wordIndex
        );

    if (!target) {
        return;
    }

    /*
       Smooth scrolling বন্ধ
    */

    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";


    /*
       ⭐ মূল correction ⭐

       আগে এখানে পুরো vocabulary sentence
       scroll করা হচ্ছিল।

       এখন সরাসরি clicked vocabulary
       WORD CARD-কে screen-এর মাঝখানে
       আনা হবে।
    */

    target.scrollIntoView({
        behavior: "auto",
        block: "center",
        inline: "nearest"
    });


    /*
       Exact vocabulary word highlight
    */

    const wordTitle =
        target.querySelector(".word-title");


    if (wordTitle) {

        wordTitle.classList.add(
            "active-word"
        );

    }


    /*
       2.5 seconds পরে highlight remove
    */

    setTimeout(() => {

        if (wordTitle) {

            wordTitle.classList.remove(
                "active-word"
            );

        }

    }, 2500);

}

   GO TO PASSAGE SENTENCE — INSTANT
========================================================= */

function goToPassageSentence(sentenceIndex) {

    const target =
        document.getElementById(
            sentenceID(sentenceIndex)
        );

    if (!target) {
        return;
    }

    /*
       Smooth scrolling সম্পূর্ণ বন্ধ।
    */

    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";

    target.scrollIntoView({
        behavior: "auto",
        block: "center"
    });

    target.classList.add("active-sentence");

    setTimeout(() => {

        target.classList.remove("active-sentence");

    }, 2200);
}


/* =========================================================
   GO TO EXACT PASSAGE WORD — INSTANT
========================================================= */

function goToPassageWord(
    sentenceIndex,
    wordIndex
) {

    const target =
        document.getElementById(
            wordID(
                sentenceIndex,
                wordIndex
            )
        );

    if (!target) {
        return;
    }


    /*
       Smooth scrolling বন্ধ
    */

    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";


    /*
       ⭐ সরাসরি নির্দিষ্ট marked word-কে
       screen-এর মাঝখানে আনা হবে
    */

    target.scrollIntoView({
        behavior: "auto",
        block: "center",
        inline: "nearest"
    });


    /*
       Exact passage word highlight
    */

    target.classList.add(
        "active-word"
    );


    /*
       2.5 seconds পরে highlight remove
    */

    setTimeout(() => {

        target.classList.remove(
            "active-word"
        );

    }, 2500);

}

/* =========================================================
   PRONUNCIATION
========================================================= */

function pronounceSentence(index) {

    const sentences =
        splitIntoSentences(
            passageText
        );


    const text =
        sentences[index];


    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Your browser does not support speech pronunciation."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang = "en-US";

    speech.rate = 0.85;

    speech.pitch = 1;


    window.speechSynthesis.speak(
        speech
    );

}



/* =========================================================
   DATA CHECK
========================================================= */

function checkData(
    sentences,
    vocabularyMatches
) {

    const unmatched =
        vocabularyMatches.filter(
            match =>
                match.passageIndex < 0
        );

    if (unmatched.length > 0) {

        const warning =
            document.createElement("div");

        warning.className =
            "data-warning";

        warning.innerHTML =
            `
            <b>Content warning:</b>
            ${unmatched.length}
            টি vocabulary sentence Passage-এ
            খুঁজে পাওয়া যায়নি।
            <br><br>
            উপরের Vocabulary entry-গুলোর
            <b>sentence</b> text Passage-এর
            sentence-এর সঙ্গে মিলিয়ে দিন।
            `;

        document.body.insertBefore(
            warning,
            document.getElementById("passage")
        );

    }

}


/* =========================================================
   START
========================================================= */

const sentences =
    splitIntoSentences(
        passageText
    );


const vocabularyMatches =
    buildVocabularyMatches(
        sentences
    );


const passageVocabularyMap =
    buildPassageVocabularyMap(
        vocabularyMatches
    );


checkData(
    sentences,
    vocabularyMatches
);


createPassage(
    sentences,
    passageVocabularyMap
);


createVocabulary(
    vocabularyMatches
);

</script>
