 soil, and many other natural factors. Nature is everywhere in ‘perpetual’ ‘motion’; conditions are never ‘exactly’ the same in any two years. Modern research ‘divides’ nature into tiny pieces and ‘conducts’ ‘tests’ that ‘conform’ neither with natural law nor with practical experiences. The ‘results’ are ‘arranged’ for the ‘convenience’ of research, not according to the needs of the farmer. To ‘think’ that these ‘conclusions’ can be put to use with ‘invariable’ ‘success’ in the farmer's field is a big mistake. ‘Recently’ Professor Tsuno of Ehime University wrote a ‘lengthy’ book on the ‘relationship’ of plant metabolism to rice harvests. This professor often comes to my field, ‘digs’ down a few feet to ‘check’ the soil, ‘brings’ students along to ‘measure’ the angle of sunlight and ‘shade’ and whatnot, and takes plant ‘specimens’ back to the lab for ‘analysis’. I often ask him, "When you go back, are you going to try non-cultivation direct ‘seeding’?" He laughingly answers, "No, I'll ‘leave’ the applications to you, I'm going to ‘stick’ to research," So that is how it is. You study the function of the plant's metabolism and its ‘ability’ to ‘absorb’ ‘nutrients’ from the soil, write a book, and get a ‘doctorate’ in ‘agricultural’ science. But do not ask if your ‘theory’ of ‘assimilation’ is going to be ‘relevant’ to the ‘yield’. Even if you can ‘explain’ how metabolism ‘affects’ the ‘productivity’ of the top leaf when the ‘average’ ‘temperature’ is eighty-four degrees (Fahrenheit), there are places where the temperature is not eighty-four degrees. And if the temperature is eighty-four degrees in Ehime this year, next year it may only be seventy-five degrees. To say that simply ‘stepping up’ metabolism will ‘increase’ ‘starch’ ‘formation’ and ‘produce’ a large harvest is a mistake. The ‘geography’ and ‘topography’ of the land, the condition of the soil, its structure, ‘texture’, and ‘drainage’, ‘exposure’ to sunlight, insect relationships, the ‘variety’ of seed used,    এখান থেকে নিচের code সাধারণত edit করবে না।

/* =========================================================
   GET ELEMENTS
========================================================= */

const passageContainer =
    document.getElementById("passage");


const vocabularyContainer =
    document.getElementById("vocabulary");



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}



/* =========================================================
   SPLIT FULL PASSAGE INTO SENTENCES
========================================================= */

function splitIntoSentences(text) {

    const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);

    const cleanLines = lines.filter(line => {

        if (/^\d+\s+.+,\s*Born\s+\d{4}$/i.test(line)) {
            return false;
        }

        if (/^Ash Sheikh Radwan$/i.test(line)) {
            return false;
        }

        return true;
    });

    const sentences = [];

    cleanLines.forEach(line => {

        const parts = line
            .split(/(?<=[.!?])\s+(?=[A-Z“"‘'])/)
            .map(sentence => sentence.trim())
            .filter(sentence => sentence.length > 0);

        parts.forEach(sentence => {
            sentences.push(sentence);
        });

    });

    return sentences;
}


/* =========================================================
   SENTENCE TEXT MATCHING
   ---------------------------------------------------------
   Passage-এর sentence number এবং
   vocabulary entry number একই হওয়া আর
   বাধ্যতামূলক নয়।
========================================================= */

function normalizeSentenceForMatching(text) {

    return String(text || "")
        .toLowerCase()
        .replace(/^\s*\d+\)\s*/g, "")
        .replace(/[^a-z0-9\u0980-\u09ff]+/g, "")
        .trim();

}


function buildVocabularyMatches(sentences) {

    const usedPassageIndexes = new Set();

    return vocabularyData.map(
        (data, vocabularyIndex) => {

            const target =
                normalizeSentenceForMatching(
                    data.sentence
                );

            let passageIndex = -1;

            for (
                let i = 0;
                i < sentences.length;
                i++
            ) {

                if (usedPassageIndexes.has(i)) {
                    continue;
                }

                if (
                    normalizeSentenceForMatching(
                        sentences[i]
                    ) === target
                ) {

                    passageIndex = i;
                    usedPassageIndexes.add(i);
                    break;

                }

            }

            return {
                data,
                vocabularyIndex,
                passageIndex
            };

        }
    );

}


function buildPassageVocabularyMap(
    vocabularyMatches
) {

    const map = new Map();

    vocabularyMatches.forEach(match => {

        if (match.passageIndex >= 0) {
            map.set(
                match.passageIndex,
                match
            );
        }

    });

    return map;
}


/* =========================================================
   CREATE IDS
========================================================= */

function sentenceID(index) {
    return "passage-sentence-" + index;
}


function vocabularyID(index) {
    return "vocabulary-sentence-" + index;
}


function wordID(sentenceIndex, wordIndex) {

    return (
        "passage-word-" +
        sentenceIndex +
        "-" +
        wordIndex
    );

}


/* =========================================================
   MARK VOCABULARY WORDS
========================================================= */

function markVocabularyWords(
    sentence,
    vocabulary,
    passageIndex
) {

    let result = escapeHTML(sentence);

    vocabulary.forEach(
        (item, wordIndex) => {

            const word =
                escapeHTML(item.word);

            const safeWord =
                word.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );

            const regex =
                new RegExp(
                    "(?<![A-Za-z])" +
                    safeWord +
                    "(?![A-Za-z])",
                    "gi"
                );

            result =
                result.replace(
                    regex,

                    `<span
                        id="${wordID(passageIndex, wordIndex)}"
                        class="marked-word"
                        onclick="goToVocabularyWord(${passageIndex}, ${wordIndex})"
                    >$&</span>`
                );

        }
    );

    return result;
}


/* =========================================================
   CREATE PASSAGE
========================================================= */

function createPassage(
    sentences,
    passageVocabularyMap
) {

    passageContainer.innerHTML = "";

    sentences.forEach(
        (sentence, passageIndex) => {

            const match =
                passageVocabularyMap.get(
                    passageIndex
                );

            const data =
                match
                    ? match.data
                    : null;

            const vocabulary =
                data
                    ? data.vocabulary
                    : [];


            const sentenceDiv =
                document.createElement("div");

            sentenceDiv.className =
                "passage-sentence";

            sentenceDiv.id =
                sentenceID(passageIndex);


            const sentenceHTML =
                markVocabularyWords(
                    sentence,
                    vocabulary,
                    passageIndex
                );


            let actions = "";


            if (data) {

                actions +=
                    `
                    <a
                        href="#${vocabularyID(passageIndex)}"
                        class="action-button see-full"
                        onclick="highlightVocabularySentence(${passageIndex})"
                    >
                        SEE FULL
                    </a>
                    `;

            }


            actions +=
                `
                <button
                    class="action-button pronounce"
                    onclick="pronounceSentence(${passageIndex})"
                >
                    🔊 PRONOUNCE
                </button>
                `;


            sentenceDiv.innerHTML =
                sentenceHTML +
                actions;

            passageContainer.appendChild(
                sentenceDiv
            );

        }
    );

}


/* =========================================================
   CREATE VOCABULARY
   ---------------------------------------------------------
   Vocabulary entry নিজেই তার English sentence
   দিয়ে Passage-এর matching sentence খুঁজে নেয়।
========================================================= */

function createVocabulary(
    vocabularyMatches
) {

    vocabularyContainer.innerHTML = "";

    vocabularyMatches.forEach(
        match => {

            const data =
                match.data;

            const passageIndex =
                match.passageIndex;

            const vocabularyIndex =
                match.vocabularyIndex;


            const box =
                document.createElement("div");

            box.className =
                "vocab-sentence";


            if (passageIndex >= 0) {

                box.id =
                    vocabularyID(
                        passageIndex
                    );

            } else {

                box.id =
                    "vocabulary-unmatched-" +
                    vocabularyIndex;

            }


            let html =
                `
                <div class="vocab-english">

                    ${escapeHTML(
                        data.sentence
                    )}

                    ${
                        passageIndex >= 0
                            ?
                            `
                            <a
                                class="sentence-back-button"
                                onclick="goToPassageSentence(${passageIndex})"
                            >
                                ↩ BACK TO PASSAGE
                            </a>
                            `
                            :
                            `
                            <span
                                class="sentence-back-button"
                                style="opacity:.55;cursor:default;"
                            >
                                ⚠ PASSAGE SENTENCE NOT FOUND
                            </span>
                            `
                    }

                </div>


                <div class="bangla-meaning">

                    ${escapeHTML(
                        data.meaning
                    )}

                    ${
                        passageIndex >= 0
                            ?
                            `
                            <a
                                class="sentence-back-button"
                                onclick="goToPassageSentence(${passageIndex})"
                            >
                                ↩ BACK TO PASSAGE
                            </a>
                            `
                            :
                            ``
                    }

                </div>
                `;


            data.vocabulary.forEach(
                (item, wordIndex) => {

                    const cardID =
                        passageIndex >= 0
                            ?
                            "vocab-word-" +
                            passageIndex +
                            "-" +
                            wordIndex
                            :
                            "vocab-word-unmatched-" +
                            vocabularyIndex +
                            "-" +
                            wordIndex;


                    html +=
                        `
                        <div
                            class="word-card"
                            id="${cardID}"
                        >

                            <div class="word-title">
                                ${escapeHTML(
                                    item.word
                                )}
                            </div>


                            <div class="word-details">

                                <b>
                                    Part of Speech:
                                </b>

                                ${escapeHTML(
                                    item.pos
                                )}

                                <br>

                                <b>
                                    Bangla Meaning:
                                </b>

                                ${escapeHTML(
                                    item.meaning
                                )}

                                <br>

                                <b>
                                    IPA:
                                </b>

                                ${escapeHTML(
                                    item.ipa
                                )}

                                <br>

                                <b>
                                    Pronunciation:
                                </b>

                                ${escapeHTML(
                                    item.pronunciation
                                )}

                                <br>

                                <b>
                                    Synonyms:
                                </b>

                                ${escapeHTML(
                                    item.synonyms
                                )}

                                <br>

                                <b>
                                    Antonyms:
                                </b>

                                ${escapeHTML(
                                    item.antonyms
                                )}

                                <br>

                                ${
                                    passageIndex >= 0
                                        ?
                                        `
                                        <a
                                            class="back-to-passage"
                                            onclick="
                                                goToPassageWord(
                                                    ${passageIndex},
                                                    ${wordIndex}
                                                )
                                            "
                                        >
                                            ↩ BACK TO PASSAGE
                                        </a>
                                        `
                                        :
                                        ``
                                }

                            </div>

                        </div>
                        `;

                }
            );


            box.innerHTML =
                html;

            vocabularyContainer.appendChild(
                box
            );

        }
    );

}


/* =========================================================
   HIGHLIGHT VOCABULARY SENTENCE
========================================================= */

function highlightVocabularySentence(
    sentenceIndex
) {

    const target =
        document.getElementById(
            vocabularyID(sentenceIndex)
        );


    if (!target) {

        return;

    }


    setTimeout(() => {

        target.classList.add(
            "active-sentence"
        );


        setTimeout(() => {

            target.classList.remove(
                "active-sentence"
            );

        }, 2200);

    }, 250);

}

/* =========================================================
   GO TO VOCABULARY SENTENCE — INSTANT
========================================================= */

function goToVocabularySentence(sentenceIndex) {

    const target =
        document.getElementById(
            vocabularyID(sentenceIndex)
        );

    if (!target) {
        return;
    }

    /*
       Smooth scrolling সম্পূর্ণ বন্ধ।
       এক লাফে destination-এ যাবে।
    */

    document.documentElement.style.scrollBehavior = "auto";
    document.body.style.scrollBehavior = "auto";

    target.scrollIntoView({
        behavior: "auto",
        block: "center"
    });

    target.classList.add("active-sentence");

    setTimeout(() => {

        target.classList.remove("active-sentence");

    }, 2200);
}

/* =========================================================
   PRONUNCIATION
========================================================= */

function pronounceSentence(index) {

    const sentences =
        splitIntoSentences(
            passageText
        );


    const text =
        sentences[index];


    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Your browser does not support speech pronunciation."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang = "en-US";

    speech.rate = 0.85;

    speech.pitch = 1;


    window.speechSynthesis.speak(
        speech
    );

}



/* =========================================================
   DATA CHECK
========================================================= */

function checkData(
    sentences,
    vocabularyMatches
) {

    const unmatched =
        vocabularyMatches.filter(
            match =>
                match.passageIndex < 0
        );

    if (unmatched.length > 0) {

        const warning =
            document.createElement("div");

        warning.className =
            "data-warning";

        warning.innerHTML =
            `
            <b>Content warning:</b>
            ${unmatched.length}
            টি vocabulary sentence Passage-এ
            খুঁজে পাওয়া যায়নি।
            <br><br>
            উপরের Vocabulary entry-গুলোর
            <b>sentence</b> text Passage-এর
            sentence-এর সঙ্গে মিলিয়ে দিন।
            `;

        document.body.insertBefore(
            warning,
            document.getElementById("passage")
        );

    }

}


/* =========================================================
   START
========================================================= */

const sentences =
    splitIntoSentences(
        passageText
    );


const vocabularyMatches =
    buildVocabularyMatches(
        sentences
    );


const passageVocabularyMap =
    buildPassageVocabularyMap(
        vocabularyMatches
    );


checkData(
    sentences,
    vocabularyMatches
);


createPassage(
    sentences,
    passageVocabularyMap
);


createVocabulary(
    vocabularyMatches
);

</script>
