========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            String(event.key || "").toLowerCase();


        /* F12 */

        if (event.key === "F12") {

            event.preventDefault();

            return;
        }


        /* CTRL / CMD */

        if (
            event.ctrlKey ||
            event.metaKey
        ) {


            /* Copy */

            if (key === "c") {

                event.preventDefault();

                return;
            }


            /* Select all */

            if (key === "a") {

                event.preventDefault();

                return;
            }


            /* Save */

            if (key === "s") {

                event.preventDefault();

                return;
            }


            /* View source */

            if (key === "u") {

                event.preventDefault();

                return;
            }


            /* Developer tools */

            if (
                event.shiftKey &&
                (
                    key === "i" ||
                    key === "j" ||
                    key === "c"
                )
            ) {

                event.preventDefault();

                return;
            }

        }

    },
    true
);

/* =========================================================
   ⭐⭐⭐⭐⭐ END OF EDITABLE CONTENT ⭐⭐⭐⭐⭐

   এখান থেকে সাধারণত কিছু edit করবেন না।
========================================================= */


/* =========================================================
   GET ELEMENTS
========================================================= */

const passageContainer =
    document.getElementById("passage");


const vocabularyContainer =
    document.getElementById("vocabulary");



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}



/* =========================================================
   SPLIT SENTENCES
========================================================= */

function splitIntoSentences(text) {

    const lines =
        text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(
            line => line.length > 0
        );


    const sentences = [];


    lines.forEach(line => {

        const parts =
            line
            .split(
                /(?<=[.!?])\s+(?=[A-Z“"‘'])/
            )
            .map(
                sentence =>
                sentence.trim()
            )
            .filter(
                sentence =>
                sentence.length > 0
            );


        parts.forEach(sentence => {

            sentences.push(sentence);

        });

    });


    return sentences;
}



/* =========================================================
   SENTENCE NORMALIZATION
========================================================= */

function normalizeSentenceForMatching(text) {

    return String(text || "")

        .toLowerCase()

        .replace(
            /^\s*\d+\)\s*/g,
            ""
        )

        .replace(
            /[^a-z0-9\u0980-\u09ff]+/g,
            ""
        )

        .trim();
}



/* =========================================================
   MATCH VOCABULARY
========================================================= */

function buildVocabularyMatches(sentences) {

    const usedPassageIndexes =
        new Set();


    return vocabularyData.map(

        (data, vocabularyIndex) => {


            const target =
                normalizeSentenceForMatching(
                    data.sentence
                );


            let passageIndex = -1;


            for (
                let i = 0;
                i < sentences.length;
                i++
            ) {


                if (
                    usedPassageIndexes
                    .has(i)
                ) {

                    continue;

                }


                if (

                    normalizeSentenceForMatching(
                        sentences[i]
                    )
                    ===
                    target

                ) {

                    passageIndex = i;

                    usedPassageIndexes
                        .add(i);

                    break;
                }

            }


            return {

                data,

                vocabularyIndex,

                passageIndex

            };

        }

    );

}



/* =========================================================
   CREATE MAP
========================================================= */

function buildPassageVocabularyMap(
    vocabularyMatches
) {

    const map =
        new Map();


    vocabularyMatches.forEach(
        match => {

            if (
                match.passageIndex >= 0
            ) {

                map.set(
                    match.passageIndex,
                    match
                );

            }

        }
    );


    return map;
}



/* =========================================================
   CREATE IDS
========================================================= */

function sentenceID(index) {

    return (
        "passage-sentence-" +
        index
    );

}


function vocabularyID(index) {

    return (
        "vocabulary-sentence-" +
        index
    );

}


function wordID(
    sentenceIndex,
    wordIndex
) {

    return (
        "passage-word-" +
        sentenceIndex +
        "-" +
        wordIndex
    );

}



/* =========================================================
   MARK VOCABULARY WORDS
========================================================= */

function markVocabularyWords(
    sentence,
    vocabulary,
    passageIndex
) {

    let result =
        escapeHTML(sentence);


    vocabulary.forEach(

        (item, wordIndex) => {


            const word =
                escapeHTML(item.word);


            const safeWord =
                word.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );


            const regex =
                new RegExp(

                    "(?<![A-Za-z])" +
                    safeWord +
                    "(?![A-Za-z])",

                    "gi"

                );


            result =
                result.replace(

                    regex,

                    `<span
                        id="${wordID(
                            passageIndex,
                            wordIndex
                        )}"
                        class="marked-word"
                        onclick="goToVocabularyWord(
                            ${passageIndex},
                            ${wordIndex}
                        )"
                    >$&</span>`

                );

        }

    );


    return result;
}



/* =========================================================
   CREATE PASSAGE
========================================================= */

function createPassage(
    sentences,
    passageVocabularyMap
) {

    passageContainer.innerHTML = "";


    sentences.forEach(

        (sentence, passageIndex) => {


            const match =
                passageVocabularyMap.get(
                    passageIndex
                );


            const data =
                match
                ? match.data
                : null;


            const vocabulary =
                data
                ? data.vocabulary
                : [];


            const sentenceDiv =
                document.createElement(
                    "div"
                );


            sentenceDiv.className =
                "passage-sentence";


            sentenceDiv.id =
                sentenceID(
                    passageIndex
                );


            const sentenceHTML =
                markVocabularyWords(

                    sentence,

                    vocabulary,

                    passageIndex

                );


            let actions = "";


            if (data) {

                actions +=

                    `
                    <a
                        href="#${vocabularyID(
                            passageIndex
                        )}"
                        class="action-button see-full"
                        onclick="
                            highlightVocabularySentence(
                                ${passageIndex}
                            )
                        "
                    >
                        SEE FULL
                    </a>
                    `;

            }


            actions +=

                `
                <button
                    class="action-button pronounce"
                    onclick="
                        pronounceSentence(
                            ${passageIndex}
                        )
                    "
                >
                    🔊 PRONOUNCE
                </button>
                `;


            sentenceDiv.innerHTML =
                sentenceHTML +
                actions;


            passageContainer.appendChild(
                sentenceDiv
            );

        }
    );

}



/* =========================================================
   CREATE VOCABULARY
========================================================= */

function createVocabulary(
    vocabularyMatches
) {

    vocabularyContainer.innerHTML = "";


    vocabularyMatches.forEach(

        match => {


            const data =
                match.data;


            const passageIndex =
                match.passageIndex;


            const vocabularyIndex =
                match.vocabularyIndex;


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "vocab-sentence";


            if (
                passageIndex >= 0
            ) {

                box.id =
                    vocabularyID(
                        passageIndex
                    );

            }
            else {

                box.id =
                    "vocabulary-unmatched-" +
                    vocabularyIndex;

            }


            let html =

                `
                <div class="vocab-english">

                    ${escapeHTML(
                        data.sentence
                    )}

                    ${
                        passageIndex >= 0
                        ?
                        `
                        <a
                            class="sentence-back-button"
                            onclick="
                                goToPassageSentence(
                                    ${passageIndex}
                                )
                            "
                        >
                            ↩ BACK TO PASSAGE
                        </a>
                        `
                        :
                        ""
                    }

                </div>


                <div class="bangla-meaning">

                    ${escapeHTML(
                        data.meaning
                    )}

                    ${
                        passageIndex >= 0
                        ?
                        `
                        <a
                            class="sentence-back-button"
                            onclick="
                                goToPassageSentence(
                                    ${passageIndex}
                                )
                            "
                        >
                            ↩ BACK TO PASSAGE
                        </a>
                        `
                        :
                        ""
                    }

                </div>
                `;


            data.vocabulary.forEach(

                (item, wordIndex) => {


                    const cardID =

                        passageIndex >= 0

                        ?

                        "vocab-word-" +
                        passageIndex +
                        "-" +
                        wordIndex

                        :

                        "vocab-word-unmatched-" +
                        vocabularyIndex +
                        "-" +
                        wordIndex;


                    html +=

                        `
                        <div
                            class="word-card"
                            id="${cardID}"
                        >

                            <div class="word-title">

                                ${escapeHTML(
                                    item.word
                                )}

                            </div>


                            <div class="word-details">

                                <b>
                                    Part of Speech:
                                </b>

                                ${escapeHTML(
                                    item.pos
                                )}

                                <br>


                                <b>
                                    Bangla Meaning:
                                </b>

                                ${escapeHTML(
                                    item.meaning
                                )}

                                <br>


                                <b>
                                    IPA:
                                </b>

                                ${escapeHTML(
                                    item.ipa
                                )}

                                <br>


                                <b>
                                    Pronunciation:
                                </b>

                                ${escapeHTML(
                                    item.pronunciation
                                )}

                                <br>


                                <b>
                                    Synonyms:
                                </b>

                                ${escapeHTML(
                                    item.synonyms
                                )}

                                <br>


                                <b>
                                    Antonyms:
                                </b>

                                ${escapeHTML(
                                    item.antonyms
                                )}

                                <br>


                                ${
                                    passageIndex >= 0
                                    ?
                                    `
                                    <a
                                        class="back-to-passage"
                                        onclick="
                                            goToPassageWord(
                                                ${passageIndex},
                                                ${wordIndex}
                                            )
                                        "
                                    >
                                        ↩ BACK TO PASSAGE
                                    </a>
                                    `
                                    :
                                    ""
                                }

                            </div>

                        </div>
                        `;

                }
            );


            box.innerHTML =
                html;


            vocabularyContainer.appendChild(
                box
            );

        }
    );

}

/* =========================================================
   PRONUNCIATION
========================================================= */

function pronounceSentence(index) {

    const sentences =
        splitIntoSentences(
            passageText
        );


    const text =
        sentences[index];


    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Your browser does not support speech pronunciation."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-US";


    speech.rate =
        0.85;


    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}



/* =========================================================
   DATA CHECK
========================================================= */

function checkData(
    sentences,
    vocabularyMatches
) {

    const unmatched =
        vocabularyMatches.filter(

            match =>
                match.passageIndex < 0

        );


    if (
        unmatched.length > 0
    ) {

        const warning =
            document.createElement(
                "div"
            );


        warning.className =
            "data-warning";


        warning.innerHTML =

            `
            <b>Content warning:</b>

            ${unmatched.length}

            vocabulary sentence
            Passage-এ
            খুঁজে পাওয়া যায়নি।

            <br><br>

            Vocabulary-এর
            <b>sentence</b>
            Passage-এর sentence-এর
            সঙ্গে মিলিয়ে দিন।
            `;


        document.body.insertBefore(

            warning,

            document.getElementById(
                "passage"
            )

        );

    }

}



/* =========================================================
   START
========================================================= */

const sentences =
    splitIntoSentences(

    );


const vocabularyMatches =
    buildVocabularyMatches(
        sentences
    );


const passageVocabularyMap =
    buildPassageVocabularyMap(
        vocabularyMatches
    );


checkData(
    sentences,
    vocabularyMatches
);


createPassage(
    sentences,
    passageVocabularyMap
);


createVocabulary(
    vocabularyMatches
);


</script>
